<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin RetroLens</title>
  <style>
    :root {
      --bg: #0c111a;
      --panel: #121b2a;
      --panel-alt: #172639;
      --line: rgba(255,255,255,0.08);
      --text: #edf3ff;
      --muted: #9eb0c9;
      --accent: #74d0ff;
      --accent-2: #8cf2c8;
      --danger: #ff7f7f;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #15273a 0%, var(--bg) 42%);
      color: var(--text);
    }
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 18px 64px;
    }
    .header {
      margin-bottom: 24px;
    }
    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 12px;
      color: var(--accent);
      margin-bottom: 12px;
    }
    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      margin: 0;
    }
    .card {
      background: rgba(18, 27, 42, 0.9);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.26);
      overflow: hidden;
    }
    .pin-panel {
      padding: 26px;
      max-width: 440px;
      margin: 28px auto 0;
    }
    label {
      display: block;
      font-size: 0.92rem;
      color: var(--muted);
      margin-bottom: 10px;
    }
    input {
      width: 100%;
      padding: 16px 14px;
      background: var(--panel-alt);
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      font-size: 1.2rem;
      letter-spacing: 0.28em;
      text-align: center;
    }
    button {
      display: inline-flex;
      width: 100%;
      justify-content: center;
      align-items: center;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #08131c;
      padding: 14px 18px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 16px;
    }
    button:hover { filter: brightness(1.03); }
    .status {
      min-height: 22px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .status.error { color: var(--danger); }
    .status.success { color: var(--accent-2); }

    .panel-hidden { display: none; }
    .report {
      padding: 18px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }
    thead {
      background: rgba(116, 208, 255, 0.08);
    }
    th, td {
      padding: 14px 12px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    th { color: var(--accent); }
    tbody tr:hover { background: rgba(255,255,255,0.02); }
    .pill {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(140, 242, 200, 0.15);
      border: 1px solid rgba(140, 242, 200, 0.25);
      color: var(--accent-2);
      font-size: 0.75rem;
    }
    .empty {
      padding: 30px 18px;
      text-align: center;
      color: var(--muted);
    }
    @media (max-width: 720px) {
      th, td {
        padding: 12px 8px;
      }
      table {
        display: block;
        overflow-x: auto;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="header">
      <div class="eyebrow">RetroLens Admin</div>
      <h1>Monitoring pengunjung</h1>
    </header>

    <section id="pinCard" class="card pin-panel">
      <label for="pinInput">Masukkan PIN 6 digit</label>
      <input id="pinInput" type="password" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="••••••" aria-label="PIN admin">
      <button id="submitPin" type="button">Masuk ke admin</button>
      <div id="status" class="status" aria-live="polite"></div>
    </section>

    <section id="reportCard" class="card report panel-hidden" aria-live="polite">
      <table>
        <thead>
          <tr>
            <th>Waktu</th>
            <th>IP Address</th>
            <th>Lokasi</th>
            <th>Device</th>
            <th>Foto</th>
          </tr>
        </thead>
        <tbody id="visitRows"></tbody>
      </table>
    </section>
  </main>

  <script>
    const pinInput = document.getElementById('pinInput');
    const statusEl = document.getElementById('status');
    const pinCard = document.getElementById('pinCard');
    const reportCard = document.getElementById('reportCard');
    const visitRows = document.getElementById('visitRows');

    function setStatus(message, type) {
      statusEl.textContent = message;
      statusEl.className = 'status';
      if (type) statusEl.classList.add(type);
    }

    function formatDate(timestamp) {
      if (!timestamp) return '-';
      const date = new Date(timestamp);
      if (Number.isNaN(date.getTime())) return timestamp;
      return new Intl.DateTimeFormat('id-ID', {
        dateStyle: 'medium',
        timeStyle: 'short',
      }).format(date);
    }

    function renderTable(visits) {
      if (!visits || !visits.length) {
        visitRows.innerHTML = '<tr><td colspan="5" class="empty">Belum ada data kunjungan.</td></tr>';
        return;
      }

      visitRows.innerHTML = visits.map((visit) => `
        <tr>
          <td>${formatDate(visit.visit_time)}</td>
          <td>${visit.ip_address || '-'}</td>
          <td>${visit.location || '-'}</td>
          <td>${visit.device_name || '-'}</td>
          <td><span class="pill">${Number(visit.photo_count || 0)} foto</span></td>
        </tr>
      `).join('');
    }

    async function fetchVisits(pin) {
      const response = await fetch('/api/admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin, action: 'list' }),
      });

      const data = await response.json();
      if (!response.ok || !data.ok) {
        throw new Error(data.message || 'PIN tidak valid.');
      }

      renderTable(data.visits || []);
      pinCard.classList.add('panel-hidden');
      reportCard.classList.remove('panel-hidden');
    }

    document.getElementById('submitPin').addEventListener('click', async () => {
      const pin = pinInput.value.trim();
      if (!/^\d{6}$/.test(pin)) {
        setStatus('PIN harus 6 digit angka.', 'error');
        return;
      }

      setStatus('Memeriksa PIN...', '');
      try {
        const response = await fetch('/api/admin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin, action: 'verify' }),
        });

        const data = await response.json();
        if (!response.ok || !data.ok) {
          throw new Error(data.message || 'PIN tidak valid.');
        }

        await fetchVisits(pin);
        setStatus('Akses admin berhasil dibuka.', 'success');
      } catch (error) {
        setStatus(error.message || 'PIN tidak valid.', 'error');
      }
    });

    pinInput.addEventListener('input', () => {
      pinInput.value = pinInput.value.replace(/\D/g, '').slice(0, 6);
    });

    pinInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        document.getElementById('submitPin').click();
      }
    });
  </script>
</body>
</html>
